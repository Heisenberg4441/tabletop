name: Native builds

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest available Xcode
        run: |
          if [ -d /Applications/Xcode_27.app ]; then sudo xcode-select -s /Applications/Xcode_27.app; fi
          xcodebuild -version
      - run: ./build.sh --debug
      - uses: actions/upload-artifact@v4
        with:
          name: tabletop-macos
          path: build/Tabletop.app
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    container: swift:5.9-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends meson ninja-build pkg-config libgtk-4-dev libadwaita-1-dev libjson-glib-dev python3
      - name: Build the shared Swift engine
        run: swift build -c release --build-path .build-linux
      - name: Test the engine
        timeout-minutes: 4
        run: python3 Tools/engine-smoke.py .build-linux/release/Tabletop
      - name: Build the GNOME shell
        run: |
          meson setup platforms/linux/build platforms/linux
          ninja -C platforms/linux/build
      - name: Package Linux
        run: |
          mkdir -p release/engine
          cp .build-linux/release/Tabletop release/engine/
          cp platforms/linux/build/tabletop-ui release/
          tar -C release -czf "$PWD/tabletop-linux-x64.tar.gz" .
          mv tabletop-linux-x64.tar.gz release/
      - uses: actions/upload-artifact@v4
        with:
          name: tabletop-linux
          path: release/tabletop-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
      - name: Inspect the Swift SDK
        shell: pwsh
        run: |
          Write-Output "SDKROOT=$env:SDKROOT"
          swiftc -print-target-info
      - name: Build the shared Swift engine
        run: swift build -c release --build-path .build-windows
      - name: Test the engine
        run: python Tools/engine-smoke.py .build-windows/release/Tabletop.exe
      - name: Build the WinUI shell
        run: dotnet publish platforms/windows/Tabletop/Tabletop.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o release/ui
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/ui/engine
          Copy-Item .build-windows/release/Tabletop.exe release/ui/engine/
          Copy-Item "$env:LOCALAPPDATA\Programs\Swift\Runtimes\6.2.3\usr\bin\*.dll" release/ui/
          Compress-Archive -Path release/ui/* -DestinationPath release/tabletop-windows-x64.zip
      - name: Smoke-test the Windows shell
        shell: pwsh
        run: |
          $started = Get-Date
          $app = Start-Process "$PWD/release/ui/Tabletop.exe" -WorkingDirectory "$PWD/release/ui" -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          try {
            if ($app.HasExited) {
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $started } -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } |
                Select-Object -First 10 | Format-List ProviderName, Id, LevelDisplayName, Message
              throw "Tabletop.exe exited during startup with code $($app.ExitCode)."
            }
            if ($app.MainWindowHandle -eq [IntPtr]::Zero) { throw 'Tabletop.exe is running but has no main window.' }
            Write-Output "Windows shell opened a main window: $($app.MainWindowTitle)"
          }
          finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tabletop-windows
          path: release/tabletop-windows-x64.zip
          if-no-files-found: error
